name: Build Clean PC Installers (Windows, Linux, macOS)

on:
  release:
    types: [published]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PySide6 and PyInstaller (No UPX to avoid AV false positives)
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 pyinstaller pillow

      - name: Convert icon.png to icon.ico
        working-directory: pc-client
        run: |
          python -c "from PIL import Image; img = Image.open('icon.png'); img.save('icon.ico', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])"

      - name: Build Clean Windows App (--onedir --noupx with Version Info)
        working-directory: pc-client
        run: |
          pyinstaller --noconfirm --onedir --windowed --noupx --name "3DS-Drop" --icon "icon.ico" --version-file "version_info.txt" --add-data "icon.png;." main.py

      - name: Create Portable ZIP (3DS-Drop-Windows-Portable.zip)
        run: |
          powershell -Command "Compress-Archive -Path 'pc-client\dist\3DS-Drop\*' -DestinationPath '3DS-Drop-Windows-Portable.zip' -Force"

      - name: Build Official Windows Setup Installer with Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" pc-client\installer.iss

      - name: Upload Clean Windows Packages to Release v1.0.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.0 3DS-Drop-Windows-Setup.exe 3DS-Drop-Windows-Portable.zip --clobber

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 pyinstaller

      - name: Build Linux Binary (--noupx)
        working-directory: pc-client
        run: |
          pyinstaller --noconfirm --onefile --windowed --noupx --name "3DS-Drop" main.py

      - name: Upload to Release v1.0.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mv pc-client/dist/3DS-Drop 3DS-Drop-Linux-x86_64
          chmod +x 3DS-Drop-Linux-x86_64
          gh release upload v1.0.0 3DS-Drop-Linux-x86_64 --clobber

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 pyinstaller

      - name: Build macOS App Bundle (--noupx)
        working-directory: pc-client
        run: |
          pyinstaller --noconfirm --windowed --noupx --name "3DS-Drop" main.py

      - name: Upload to Release v1.0.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd pc-client/dist
          zip -r ../../3DS-Drop-macOS.zip 3DS-Drop.app
          cd ../..
          gh release upload v1.0.0 3DS-Drop-macOS.zip --clobber
